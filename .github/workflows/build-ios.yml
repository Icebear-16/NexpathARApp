name: Build iOS for TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Unity iOS & Xcode Archive
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore Git LFS Assets
        run: |
          git lfs pull

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Build Unity iOS Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.6.5f1
          buildsPath: build

      - name: Compile & Create Xcode Archive (.xcarchive)
        run: |
          echo "Building Xcode Archive..."
          cd build/iOS
          xcodebuild -project Unity-iPhone.xcodeproj \
                     -scheme Unity-iPhone \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath NexpathARApp.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     archive
          echo "Zipping xcarchive for distribution..."
          zip -r -y -q NexpathARApp.xcarchive.zip NexpathARApp.xcarchive

      - name: Upload .xcarchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexpathARApp-xcarchive
          path: build/iOS/NexpathARApp.xcarchive.zip
          retention-days: 14
